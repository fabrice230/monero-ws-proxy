
name: Build RandomX WebAssembly

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make nodejs npm clang binaryen

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Install project
        run: make install

      - name: Compile RandomX
        run: make build

      - name: Check output
        run: |
          ls -lh public/randomx.js
          ls -lh public/randomx.wasm

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: randomx-wasm
          path: |
            public/randomx.js
            public/randomx.wasm
